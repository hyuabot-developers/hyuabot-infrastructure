# Strategic merge patch for an existing cluster. Apply with `kubectl patch`,
# not `kubectl apply`. The subway updater workflow owns the immutable image.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: subway-realtime-cron-job
  namespace: hyuabot
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: subway-realtime-cron-job
            env:
            - name: KORAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: KORAIL_API_KEY
                  optional: true
            - name: SEOUL_METRO_ALERT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: SEOUL_METRO_ALERT_API_KEY
                  optional: true
